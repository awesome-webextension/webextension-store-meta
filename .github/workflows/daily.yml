name: Daily Store Health
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  store-health:
    name: Store health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Test 🧪
        run: npm run test

      - name: Source health 🩺
        run: npm run test:daily
